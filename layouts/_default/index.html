{{ define "main" }}
<div style="max-width:850px; margin:40px auto; background:#161b22; padding:30px; border-radius:8px; border:1px solid #30363d;">
  <h1 style="color:#58a6ff; margin-top:0;">{{ .Title }}</h1>
  <div>{{ .Content }}</div>
  <hr style="border:none; border-top:1px solid #30363d; margin:20px 0;">
  <p><a href="{{ "generator/" | relURL }}" style="display:inline-block; background:#238636; color:#fff; padding:10px 18px; text-decoration:none; border-radius:6px; font-weight:bold;">&rarr; Launch Interactive Audit Terminal</a></p>
</div>
{{ end }}
